<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home — Online Business</title>
    <link rel="stylesheet" href="edit_product.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <header class="site-header">
    <div class="wrap header-inner">
      <h1 class="brand">Online Business</h1>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="admin.html">Admin</a>
        <a class="active" href="edit_product.html">Edit_product</a>
      </nav>
    </div>
  </header>
  <body>
    <main class="container">
      <h2>Edit Products</h2>
      <div id="productGrid" class="product-grid"></div>
    </main>

    <!-- Edit Modal -->
    <div id="editModal" class="edit-modal">
      <div class="edit-modal-content">
        <span class="close-modal">&times;</span>
        <div class="edit-wrapper">
          <div class="edit-image">
            <img
              id="productImg"
              src="uploads/clothes.jpg"
              alt="Product Image"
            />
          </div>
          <div class="edit-form">
            <form id="editProductForm" enctype="multipart/form-data">
              <input type="hidden" name="action" value="edit" />

              <label>Product ID:</label>
              <input
                type="number"
                name="id"
                id="productId"
                readonly
              /><br /><br />

              <label>Product Name:</label>
              <input
                type="text"
                name="name"
                id="productName"
                required
              /><br /><br />

              <label>Price:</label>
              <input
                type="number"
                step="0.01"
                name="price"
                id="productPrice"
                required
              /><br /><br />

              <label>Stock:</label>
              <input
                type="number"
                name="stock"
                id="productStock"
                required
              /><br /><br />

              <label>Change Photo:</label>
              <input
                type="file"
                name="photo"
                id="productPhoto"
                accept="image/*"
              /><br /><br />

              <button type="submit">Update Product</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <p>&copy; 2025 Online Business. All rights reserved.</p>
    </footer>

    <script>
      const modal = document.getElementById("editModal");
      const closeBtn = document.querySelector(".close-modal");
      const form = document.getElementById("editProductForm");

      // Close modal
      closeBtn.onclick = () => {
        modal.style.display = "none";
      };
      window.onclick = (e) => {
        if (e.target == modal) {
          modal.style.display = "none";
        }
      };

      // Fetch products
      fetch("./backend/edit_product.php")
        .then((res) => res.json())
        .then((data) => {
          const grid = document.getElementById("productGrid");
          if (data.length === 0) {
            grid.innerHTML = "<p>No products found.</p>";
          } else {
            data.forEach((p) => {
              const card = document.createElement("div");
              card.className = "product-card";
              card.innerHTML = `
              <img src="${p.image}" alt="${p.name}">
              <h3>${p.name}</h3>
              <p class="price">Rs.${parseFloat(p.price).toFixed(2)}</p>
            `;
              grid.appendChild(card);

              // Click product photo → open modal
              card.querySelector("img").addEventListener("click", () => {
                modal.style.display = "block";
                document.getElementById("productId").value = p.id;
                document.getElementById("productName").value = p.name;
                document.getElementById("productPrice").value = p.price;
                document.getElementById("productStock").value = p.stock;
                document.getElementById("productImg").src = p.image
                  ? p.image
                  : "uploads/clothes.jpg";
              });
            });
          }
        })
        .catch((err) => console.error("Error loading products:", err));

      // Handle form submit
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const formData = new FormData(form);

        fetch("./backend/add_product.php", {
          method: "POST",
          body: formData,
        })
          .then((res) => res.text())
          .then((res) => {
            alert(res);
            modal.style.display = "none";
            location.reload();
          })
          .catch((err) => console.error(err));
      });
    </script>
  </body>
</html>
