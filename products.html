<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — Online Business</title>
  <link rel="stylesheet" href="products.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <h1 class="brand">Online Business</h1>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a class="active" href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Our Products</h2>
    <div class="product-grid">
      <!-- Product 1 -->
      <div class="product-card">
        <img src="bag.jpg" alt="Bag">
        <h3>Bag</h3>
        <p class="price">Rs.3,500.00</p>
      </div>

      <!-- Product 2 -->
      <div class="product-card">
        <img src="shoes.jpg" alt="Shoes">
        <h3>Shoes</h3>
        <p class="price">Rs.2,599.00</p>
      </div>

      <!-- Product 3 -->
      <div class="product-card">
        <img src="clothes.jpg" alt="Clothes">
        <h3>Clothes</h3>
        <p class="price">Rs.2,990.00</p>
      </div>

      <!-- Product 4 -->
      <div class="product-card">
        <img src="home decors.jpg" alt="Kitchen Accessories">
        <h3>Kitchen Accessories</h3>
        <p class="price">Rs.4,950.00</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 Online Business. All rights reserved.</p>
  </footer>
