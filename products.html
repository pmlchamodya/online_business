<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products — Online Business</title>
    <link rel="stylesheet" href="products.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Cart icon styling */
      .cart-icon {
        width: 24px;
        height: 24px;
        vertical-align: middle;
        filter: invert(1); /* white icon on dark bg */
        transition: transform 0.2s;
      }
      .cart-icon:hover {
        transform: scale(1.2);
      }
      .main-nav a {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-inner">
        <h1 class="brand">Online Business</h1>
        <nav class="main-nav">
          <a href="index.html">Home</a>
          <a class="active" href="products.html">Products</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
          <a href="cart.html">
            <img src="uploads/cart.png" alt="Cart" class="cart-icon" />
          </a>
          <a href="admin.html">Admin</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <h2>Our Products</h2>
      <div class="product-grid" id="productGrid"></div>
    </main>

    <!-- Modal -->
    <div id="productModal" class="modal">
      <span class="close">&times;</span>
      <div class="modal-content-wrapper">
        <img class="modal-content" id="modalImg" />
        <div id="modalInfo">
          <h3 id="modalName"></h3>
          <p id="modalPrice"></p>
          <p id="modalStock"></p>
          <button id="addToCartBtn">Add to Cart</button>
          <button id="addOrderBtn">Add Order</button>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <p>&copy; 2025 Online Business. All rights reserved.</p>
    </footer>

    <script>
      let currentProduct = null;

      fetch("./backend/products.php")
        .then((res) => res.json())
        .then((data) => {
          const grid = document.getElementById("productGrid");
          const modal = document.getElementById("productModal");
          const modalImg = document.getElementById("modalImg");
          const modalName = document.getElementById("modalName");
          const modalPrice = document.getElementById("modalPrice");
          const modalStock = document.getElementById("modalStock");
          const addToCartBtn = document.getElementById("addToCartBtn");
          const addOrderBtn = document.getElementById("addOrderBtn");
          const closeBtn = document.querySelector(".modal .close");

          if (data.length === 0) {
            grid.innerHTML = "<p>No products found.</p>";
          } else {
            data.forEach((p) => {
              const card = document.createElement("div");
              card.className = "product-card";
              card.innerHTML = `
                <img src="${p.image}" alt="${p.name}">
                <h3>${p.name}</h3>
                <p class="price">Rs.${parseFloat(p.price).toFixed(2)}</p>
              `;
              grid.appendChild(card);

              // Click event for modal
              card.querySelector("img").addEventListener("click", () => {
                modal.style.display = "block";
                modalImg.src = p.image;
                modalName.textContent = p.name;
                modalPrice.textContent =
                  "Price: Rs." + parseFloat(p.price).toFixed(2);
                modalStock.textContent = "Stock: " + p.stock;
                currentProduct = p;
              });
            });
          }

          // Add to Cart
          addToCartBtn.addEventListener("click", () => {
            if (!currentProduct) return;
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.push(currentProduct);
            localStorage.setItem("cart", JSON.stringify(cart));
            alert("Product added to cart!");
            modal.style.display = "none";
          });

          // Add Order (go to order.html)
          addOrderBtn.addEventListener("click", () => {
            if (!currentProduct) return;
            localStorage.setItem(
              "selectedOrder",
              JSON.stringify(currentProduct)
            );
            window.location.href = "order.html";
          });

          // Close modal
          closeBtn.onclick = () => {
            modal.style.display = "none";
          };

          // Click outside modal to close
          window.onclick = (event) => {
            if (event.target == modal) {
              modal.style.display = "none";
            }
          };
        })
        .catch((err) => console.error("Error loading products:", err));
    </script>
  </body>
</html>
