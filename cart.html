<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart — Online Business</title>
    <link rel="stylesheet" href="cart.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- HEADER -->
    <header class="site-header">
      <div class="wrap header-inner">
        <h1 class="brand">Online Business</h1>
        <nav class="main-nav">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
          <a class="active" href="cart.html">Cart</a>
          <a href="admin.html">Admin</a>
        </nav>
      </div>
    </header>

    <!-- MAIN CART -->
    <main class="container">
      <h2>Your Shopping Cart</h2>
      <div id="cartItems"></div>
      <div id="cartTotal"></div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
      <p>&copy; 2025 Online Business. All rights reserved.</p>
    </footer>

    <!-- CART SCRIPT -->
    <script>
      function loadCart() {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        const cartItemsDiv = document.getElementById("cartItems");
        const cartTotalDiv = document.getElementById("cartTotal");
        cartItemsDiv.innerHTML = "";
        let total = 0;

        if (cart.length === 0) {
          cartItemsDiv.innerHTML = "<p>Your cart is empty.</p>";
          cartTotalDiv.textContent = "";
          return;
        }

        cart.forEach((item, index) => {
          if (!item.qty) item.qty = 1;
          const price = parseFloat(item.price);
          const itemTotal = price * item.qty;
          total += itemTotal;

          const itemDiv = document.createElement("div");
          itemDiv.className = "cart-item";
          itemDiv.innerHTML = `
          <img src="${item.image}" alt="${item.name}">
          <div class="info">
            <h3>${item.name}</h3>
            <p>Rs.${price.toFixed(2)} each</p>
            <label>Qty: <input type="number" class="qtyInput" min="1" value="${
              item.qty
            }" data-index="${index}"></label>
            <p class="itemTotal">Subtotal: Rs.${itemTotal.toFixed(2)}</p>
          </div>
          <button class="removeBtn" data-index="${index}">Remove</button>
        `;
          cartItemsDiv.appendChild(itemDiv);
        });

        cartTotalDiv.innerHTML = `<h3>Total: Rs.${total.toFixed(2)}</h3>`;

        // Quantity change event
        document.querySelectorAll(".qtyInput").forEach((input) => {
          input.addEventListener("change", () => {
            const i = input.dataset.index;
            let newQty = parseInt(input.value);
            if (newQty < 1) newQty = 1;
            cart[i].qty = newQty;
            localStorage.setItem("cart", JSON.stringify(cart));
            loadCart();
          });
        });

        // Remove item event
        document.querySelectorAll(".removeBtn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const i = btn.dataset.index;
            cart.splice(i, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            loadCart();
          });
        });
      }

      loadCart();
    </script>
  </body>
</html>
